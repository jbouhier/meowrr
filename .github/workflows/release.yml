# .github/workflows/release.yml
name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'MeowRR v__VERSION__'
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-r2:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install wrangler
        run: bun add -g wrangler

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all release assets (incl. draft)
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist-release
          echo "Looking for releases with tag: $TAG"
          echo "--- All releases (published + draft) ---"
          gh api "repos/$REPO/releases" --paginate \
            | jq -r '.[] | "\(.id)\t\(.tag_name)\t\(.draft)\t\(.name)"'
          echo "--- searching ---"
          RELEASE_ID=$(gh api "repos/$REPO/releases" --paginate \
            | jq -r ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "${RELEASE_ID:-}" ]; then
            echo "No release found for tag $TAG — retrying via releases/tags/<tag>"
            RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".id" 2>/dev/null || true)
          fi
          if [ -z "${RELEASE_ID:-}" ]; then
            echo "Still not found. Aborting."
            exit 1
          fi
          echo "Found release id: $RELEASE_ID"
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" \
            | jq -r '.[] | "\(.id)\t\(.name)"' \
            | while IFS=$'\t' read -r id name; do
                echo "Downloading $name"
                gh api "repos/$REPO/releases/assets/$id" \
                  -H "Accept: application/octet-stream" \
                  > "dist-release/$name"
              done
          echo "--- assets ---"
          ls -la dist-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite latest.json URLs to R2
        run: |
          jq --arg base "https://releases.meowrr.com/${{ steps.ver.outputs.version }}" '
            .platforms |= with_entries(.value.url = ($base + "/" + (.value.url | split("/") | last)))
          ' dist-release/latest.json > dist-release/latest.rewritten.json
          mv dist-release/latest.rewritten.json dist-release/latest.json

      - name: Upload latest.json to R2 (5-min TTL)
        run: |
          wrangler r2 object put meowrr-releases/latest.json \
            --file dist-release/latest.json \
            --remote \
            --content-type application/json \
            --cache-control "public, max-age=300"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload bundles to R2 (immutable)
        run: |
          for f in dist-release/*; do
            name=$(basename "$f")
            [ "$name" = "latest.json" ] && continue
            wrangler r2 object put "meowrr-releases/${{ steps.ver.outputs.version }}/$name" \
              --file "$f" \
              --remote \
              --cache-control "public, max-age=31536000, immutable"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}