[package]
name = "meowrr"
version = "0.1.0"
description = "Track your MRR without distractions - Desktop app"
authors = ["JB Bouhier"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meowrr"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
